<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>백오피스 — jennagoround</title>
    <script src="https://developers.kakao.com/sdk/js/kakao.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/styles-DbiYfY7D.css">
  <link rel="stylesheet" crossorigin href="./assets/admin-BZ9Pqeyz.css">
</head>
<body class="admin-page">
    <header class="admin-header" id="admin-header" style="display: none;">
        <div class="admin-header-brand">
            <img src="./assets/jennagoround_logo-CLLi3Mf-.png" alt="FINDING NANGMAN" class="logo-image">
            <span class="admin-header-title">백오피스</span>
        </div>
        <nav class="admin-header-nav">
            <a href="admin.html" class="admin-nav-link">이벤트</a>
            <a href="backoffice.html" class="admin-nav-link active">백오피스</a>
            <a href="content-dashboard.html" class="admin-nav-link">콘텐츠</a>
            <a href="index.html" class="admin-nav-link">사이트로</a>
            <span class="admin-user" id="admin-user-label"></span>
            <button type="button" class="admin-btn admin-btn-outline admin-btn-sm" id="admin-logout-btn" style="color:#fff;border-color:rgba(255,255,255,0.3);background:transparent;">로그아웃</button>
        </nav>
    </header>

    <div id="admin-gate"></div>

    <main class="admin-container" id="admin-main" style="display: none;">
        <h1 class="admin-page-title">참가 신청 관리</h1>
        <p class="admin-page-sub" id="event-subtitle">이벤트별 신청자 목록을 확인하고 관리합니다.</p>

        <div class="admin-toolbar">
            <select class="admin-select" id="event-select" aria-label="이벤트 선택"></select>
            <input type="search" class="admin-input" id="search-input" placeholder="이름·닉네임·전화번호 검색…">
            <button type="button" class="admin-btn admin-btn-outline" id="export-btn">CSV 내보내기</button>
            <button type="button" class="admin-btn admin-btn-primary" id="refresh-btn">새로고침</button>
        </div>

        <div class="admin-stats-mini" id="stats-mini"></div>

        <div class="admin-table-wrap">
            <table class="admin-table" id="participants-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>닉네임</th>
                        <th>실명</th>
                        <th>성별</th>
                        <th>출생년도</th>
                        <th>전화번호</th>
                        <th>동반자</th>
                        <th>메시지</th>
                        <th>신청일시</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="participants-body">
                    <tr><td colspan="10" class="admin-empty">불러오는 중…</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="config.js"></script>
    <script src="google-sheets-sync.js"></script>
    <script src="firebase.js"></script>
    <script src="events.js"></script>
    <script src="auth.js"></script>
    <script src="admin-auth.js"></script>
    <script src="backoffice-page.js"></script>
</body>
</html>
